# Publishes docs/wiki to the repository's GitHub wiki.
# docs/wiki is the source of truth: pages edited only on the wiki are replaced
# or removed by the next publish.
name: Publish wiki

on:
  push:
    branches: ["master", "*.x-dev"]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

# Publish one revision at a time, in push order.
concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes to the wiki repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The checkout action keeps the token out of the clone URL and the process list.
      - name: Check out the wiki repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}.wiki
          path: .wiki

      - name: Sync docs/wiki to the wiki repository
        run: |
          set -euo pipefail
          # README.md documents this directory and is not a wiki page.
          rsync --archive --delete --exclude ".git/" --exclude "README.md" docs/wiki/ .wiki/
          cd .wiki
          git add --all

          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "Sync wiki from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push --quiet origin HEAD
