name: PHP tests

on:
  push:
    branches: ["master", "*.x-dev"]
  pull_request:
    branches: ["master", "*.x-dev"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, xmlwriter, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Validate Composer configuration
        run: composer validate --strict
      - name: Install development dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-plugins --no-scripts
      - name: Run unit, regression and integration tests
        run: composer test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP with line coverage
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: mbstring, dom, xml, xmlwriter, pdo_sqlite
          coverage: pcov
          tools: composer:v2
      - name: Install development dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-plugins --no-scripts
      - name: Require 100 percent production line coverage
        run: composer test:coverage
      - name: Analyze production code for PHP 7.4 compatibility
        run: composer phpstan
      - name: Check the shared PHP coding standard
        run: composer format:check
      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: build/coverage
          if-no-files-found: warn
          retention-days: 14
